<html lang="en">
<head>

<title>KevinHandley.com — WordPress Block Editor Build Checklist</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f0f2f5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-size: 14px;
    color: #1a1a2e;
  }

  /* ── Header ── */
  #header {
    background: #1E3A5F;
    color: white;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  #header-left h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.2px; }
  #header-left p  { font-size: 11px; opacity: 0.6; margin-top: 2px; }
  #header-right   { display: flex; align-items: center; gap: 20px; }
  #save-status    { font-size: 11px; opacity: 0.8; min-width: 110px; text-align: right; }
  #progress-box   { text-align: right; }
  #progress-pct   { font-size: 22px; font-weight: 700; line-height: 1; }
  #progress-sub   { font-size: 11px; opacity: 0.6; margin-top: 2px; }

  /* ── Progress bar ── */
  #progress-bar-wrap { height: 4px; background: #2E5C8A; flex-shrink: 0; }
  #progress-bar-fill { height: 100%; background: #5B8DB8; width: 0%; transition: width 0.5s ease; }

  /* ── Layout ── */
  #layout { display: flex; flex: 1; overflow: hidden; height: calc(100vh - 60px); }

  /* ── Sidebar ── */
  #sidebar {
    width: 210px;
    background: #19293d;
    flex-shrink: 0;
    overflow-y: auto;
    padding: 10px 0;
  }
  .phase-btn {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    width: 100%;
    padding: 9px 14px;
    text-align: left;
    border: none;
    cursor: pointer;
    background: transparent;
    border-left: 3px solid transparent;
    transition: all 0.15s;
  }
  .phase-btn:hover  { background: rgba(255,255,255,0.05); }
  .phase-btn.active { background: #2E5C8A; border-left-color: #5B8DB8; }
  .phase-btn .emoji { font-size: 13px; flex-shrink: 0; margin-top: 1px; }
  .phase-btn .label { font-size: 12px; color: #8fafc7; line-height: 1.35; }
  .phase-btn.active .label { color: white; font-weight: 600; }

  /* ── Main ── */
  #main { flex: 1; overflow-y: auto; padding: 20px 24px 40px; }

  #phase-header { margin-bottom: 16px; }
  #phase-title  { font-size: 19px; font-weight: 700; color: #1E3A5F; }
  #phase-sub    { font-size: 12px; color: #6b7280; margin-top: 3px; }

  /* ── Steps ── */
  #steps-list { display: flex; flex-direction: column; gap: 10px; }

  .step-card {
    background: white;
    border-radius: 10px;
    border: 2px solid #e5e7eb;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .step-card.done { border-color: #93c5fd; }

  .step-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 16px;
    cursor: pointer;
    background: white;
    transition: background 0.15s;
  }
  .step-card.done .step-header { background: #f0f7ff; }

  .step-checkbox {
    width: 22px; height: 22px;
    border-radius: 5px;
    border: 2px solid #d1d5db;
    background: white;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    cursor: pointer;
    transition: all 0.15s;
    font-size: 13px; font-weight: bold; color: white;
  }
  .step-card.done .step-checkbox {
    background: #2E5C8A;
    border-color: #2E5C8A;
  }

  .step-num   { font-size: 11px; color: #9ca3af; flex-shrink: 0; width: 22px; }
  .step-title { flex: 1; font-size: 13px; font-weight: 600; color: #1E3A5F; line-height: 1.35; }
  .step-card.done .step-title { color: #3b82f6; text-decoration: line-through; opacity: 0.65; }
  .step-arrow { font-size: 11px; color: #9ca3af; flex-shrink: 0; }

  .step-body {
    display: none;
    padding: 12px 16px 16px 52px;
    border-top: 1px solid #f3f4f6;
  }
  .step-body.open { display: block; }

  .step-detail {
    font-size: 13px;
    color: #374151;
    line-height: 1.7;
    white-space: pre-wrap;
  }

  /* ── Copy block ── */
  .copy-block {
    margin-top: 12px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid #bfdbfe;
  }
  .copy-block-header {
    display: flex; align-items: center; justify-content: space-between;
    background: #eff6ff;
    padding: 6px 12px;
  }
  .copy-label { font-size: 11px; font-weight: 700; color: #1d4ed8; letter-spacing: 0.05em; text-transform: uppercase; }
  .copy-btn {
    font-size: 11px; padding: 3px 10px; border-radius: 4px;
    border: none; background: #1d4ed8; color: white;
    cursor: pointer; font-weight: 600; transition: background 0.15s;
  }
  .copy-btn:hover   { background: #1e40af; }
  .copy-btn.copied  { background: #16a34a; }
  .copy-pre {
    background: white;
    padding: 10px 12px;
    margin: 0;
    font-size: 12px;
    color: #374151;
    white-space: pre-wrap;
    line-height: 1.6;
    font-family: ui-monospace, "Cascadia Code", monospace;
  }

  /* ── Person pills (Kevin / Fae attribution) ── */
  .pill-group { display: flex; gap: 6px; flex-shrink: 0; }
  .pill-group.lg { gap: 8px; }
  .person-pill {
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 2px solid #d1d5db;
    background: white;
    font-size: 11px; font-weight: 700;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .pill-group.lg .person-pill {
    width: 36px; height: 36px; font-size: 13px;
  }
  .person-pill:hover { transform: scale(1.08); }
  .by-tag {
    margin-top: 10px;
    font-size: 12px;
    color: #374151;
  }
  .by-tag strong { color: #1E3A5F; }
  .mark-row {
    margin-top: 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .mark-label { font-size: 12px; font-weight: 600; color: #6b7280; }

  /* ── Tip ── */
  .tip {
    margin-top: 10px;
    padding: 9px 12px;
    background: #fffbeb;
    border-left: 3px solid #f59e0b;
    border-radius: 4px;
    font-size: 12px;
    color: #78350f;
    line-height: 1.5;
  }

  /* ── Mark button ── */
  .mark-btn {
    margin-top: 14px;
    padding: 7px 16px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    background: #2E5C8A;
    color: white;
    transition: all 0.15s;
  }
  .mark-btn:hover  { background: #1E3A5F; }
  .mark-btn.undo   { background: #f3f4f6; color: #6b7280; }
  .mark-btn.undo:hover { background: #e5e7eb; }

  /* ── Phase nav ── */
  #phase-nav {
    display: flex;
    justify-content: space-between;
    margin-top: 20px;
    padding-top: 10px;
  }
  .nav-btn {
    padding: 8px 18px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .nav-btn.prev { border: 2px solid #2E5C8A; background: white; color: #2E5C8A; }
  .nav-btn.prev:hover { background: #f0f7ff; }
  .nav-btn.next { border: none; background: #2E5C8A; color: white; }
  .nav-btn.next:hover { background: #1E3A5F; }

  /* ── Loading ── */
  #loading {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100vh; gap: 16px;
    background: #f0f2f5;
  }
  .spinner {
    width: 38px; height: 38px;
    border: 3px solid #bfdbfe;
    border-top-color: #2E5C8A;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading p { font-size: 14px; color: #6b7280; }

  #app { display: none; flex-direction: column; min-height: 100vh; }

  .banner {
    background: #fffbeb;
    border-bottom: 3px solid #f59e0b;
    padding: 8px 24px;
    font-size: 12px;
    color: #78350f;
    text-align: center;
  }
</style>
</head>

// ─── People ──────────────────────────────────────────────────────
const PEOPLE = [
  { code: "K", name: "Kevin", color: "#1E3A5F" },
  { code: "F", name: "Fae",   color: "#5B8DB8" }
];

// ─── State ───────────────────────────────────────────────────────
// checked[stepId] = { done: true, by: "Kevin" } | undefined
let checked   = {};
let activeIdx = 0;
let saveTimer = null;

const allSteps = PHASES.flatMap(p => p.steps);
const total    = allSteps.length;

// ─── JSONBin helpers ─────────────────────────────────────────────
// Reads/writes under STATE_KEY so this checklist's progress lives
// alongside the other checklists' keys in the same bin without
// clobbering them. Always re-fetch before writing so a concurrent
// save from another checklist (or the other person) isn't lost.
async function loadFromBin() {
  const res  = await fetch(BIN_URL + "/latest", {
    headers: { "X-Master-Key": MASTER_KEY }
  });
  const data = await res.json();
  return data.record?.[STATE_KEY] || {};
}

async function saveToBin(checkedState) {
  let current = {};
  try {
    const res  = await fetch(BIN_URL + "/latest", {
      headers: { "X-Master-Key": MASTER_KEY }
    });
    const data = await res.json();
    current = data.record || {};
  } catch (e) { /* fall back to writing just our own key */ }

  current[STATE_KEY] = checkedState;

  await fetch(BIN_URL, {
    method:  "PUT",
    headers: { "Content-Type": "application/json", "X-Master-Key": MASTER_KEY },
    body:    JSON.stringify(current)
  });
}

// ─── UI helpers ──────────────────────────────────────────────────
function setSaveStatus(msg, color) {
  const el = document.getElementById("save-status");
  el.textContent  = msg;
  el.style.color  = color || "rgba(255,255,255,0.75)";
}

function updateProgress() {
  const done = Object.values(checked).filter(v => v && v.done).length;
  const pct  = Math.round((done / total) * 100);
  document.getElementById("progress-pct").textContent  = pct + "%";
  document.getElementById("progress-sub").textContent  = done + " of " + total + " steps";
  document.getElementById("progress-bar-fill").style.width = pct + "%";
}

function scheduleSave() {
  clearTimeout(saveTimer);
  setSaveStatus("💾 Saving…");
  saveTimer = setTimeout(async () => {
    try {
      await saveToBin(checked);
      setSaveStatus("✓ Progress saved", "#86efac");
      setTimeout(() => setSaveStatus(""), 3000);
    } catch(e) {
      setSaveStatus("⚠ Save failed — check connection", "#fca5a5");
    }
  }, 800);
}

// Clicking a person's pill:
// - if not done yet → mark done, attributed to that person
// - if done and attributed to THIS person → un-mark (undo)
// - if done and attributed to the OTHER person → re-attribute, stays done
function setStep(stepId, personName) {
  const current = checked[stepId];
  if (current && current.done && current.by === personName) {
    delete checked[stepId];
  } else {
    checked[stepId] = { done: true, by: personName };
  }
  updateProgress();
  scheduleSave();
  renderPhase();
  renderSidebar();
}

function clearStep(stepId) {
  delete checked[stepId];
  updateProgress();
  scheduleSave();
  renderPhase();
  renderSidebar();
}

function toggleExpand(stepId) {
  const body = document.getElementById("body-" + stepId);
  const arrow = document.getElementById("arrow-" + stepId);
  if (!body) return;
  const open = body.classList.toggle("open");
  arrow.textContent = open ? "▲" : "▼";
}

function personPills(stepId, activeBy, size) {
  return PEOPLE.map(p => {
    const isActive = activeBy === p.name;
    const bg = isActive ? p.color : "transparent";
    const border = isActive ? p.color : "#d1d5db";
    const fg = isActive ? "white" : "#6b7280";
    return `<button class="person-pill${size==='sm' ? ' sm' : ''}" title="${p.name}"
      style="background:${bg};border-color:${border};color:${fg};"
      onclick="event.stopPropagation(); setStep('${stepId}', '${p.name}')">${p.code}</button>`;
  }).join("");
}

// ─── Render ──────────────────────────────────────────────────────
function renderSidebar() {
  const sb = document.getElementById("sidebar");
  sb.innerHTML = PHASES.map((p, i) => {
    const done    = p.steps.every(s => checked[s.id] && checked[s.id].done);
    const started = p.steps.some(s => checked[s.id] && checked[s.id].done);
    const active  = i === activeIdx;
    const emoji   = done ? "✅" : started ? "🔵" : p.emoji;
    return `<button class="phase-btn ${active ? "active" : ""}" onclick="goPhase(${i})">
      <span class="emoji">${emoji}</span>
      <span class="label">${p.title}</span>
    </button>`;
  }).join("");
}

function renderPhase() {
  const phase = PHASES[activeIdx];
  const doneCt = phase.steps.filter(s => checked[s.id] && checked[s.id].done).length;

  document.getElementById("phase-title").textContent = phase.emoji + " " + phase.title;
  document.getElementById("phase-sub").textContent   = doneCt + " of " + phase.steps.length + " steps complete";

  document.getElementById("steps-list").innerHTML = phase.steps.map((step, i) => {
    const state = checked[step.id];
    const done  = !!(state && state.done);
    const by    = state ? state.by : null;
    const copyHtml = step.copy ? `
      <div class="copy-block">
        <div class="copy-block-header">
          <span class="copy-label">Copy / Paste Text</span>
          <button class="copy-btn" id="cbtn-${step.id}" onclick="copyText('${step.id}')">Copy</button>
        </div>
        <pre class="copy-pre" id="cpre-${step.id}">${escHtml(step.copy)}</pre>
      </div>` : "";
    const tipHtml = step.tip ? `<div class="tip">💡 ${escHtml(step.tip)}</div>` : "";
    const byTag = done ? `<div class="by-tag">Completed by <strong>${escHtml(by)}</strong></div>` : "";
    return `
      <div class="step-card ${done ? "done" : ""}" id="card-${step.id}">
        <div class="step-header" onclick="toggleExpand('${step.id}')">
          <div class="pill-group">${personPills(step.id, by, 'sm')}</div>
          <span class="step-num">${String(i+1).padStart(2,"0")}</span>
          <span class="step-title">${escHtml(step.title)}</span>
          <span class="step-arrow" id="arrow-${step.id}">▼</span>
        </div>
        <div class="step-body" id="body-${step.id}">
          <div class="step-detail">${escHtml(step.detail)}</div>
          ${copyHtml}
          ${tipHtml}
          ${byTag}
          <div class="mark-row">
            <span class="mark-label">${done ? "Change to:" : "Mark complete:"}</span>
            <div class="pill-group lg">${personPills(step.id, by)}</div>
            ${done ? `<button class="mark-btn undo" onclick="clearStep('${step.id}')">↩ Undo</button>` : ""}
          </div>
        </div>
      </div>`;
  }).join("");

  // Phase nav
  const nav = document.getElementById("phase-nav");
  const prevBtn = activeIdx > 0
    ? `<button class="nav-btn prev" onclick="goPhase(${activeIdx-1})">← Previous</button>` : "<div></div>";
  const nextBtn = activeIdx < PHASES.length - 1
    ? `<button class="nav-btn next" onclick="goPhase(${activeIdx+1})">Next Phase →</button>` : "";
  nav.innerHTML = prevBtn + nextBtn;
}

function goPhase(idx) {
  activeIdx = idx;
  renderSidebar();
  renderPhase();
  document.getElementById("main").scrollTop = 0;
}

function copyText(stepId) {
  const step = allSteps.find(s => s.id === stepId);
  if (!step || !step.copy) return;
  navigator.clipboard.writeText(step.copy).then(() => {
    const btn = document.getElementById("cbtn-" + stepId);
    if (btn) {
      btn.textContent = "✓ Copied!";
      btn.classList.add("copied");
      setTimeout(() => { btn.textContent = "Copy"; btn.classList.remove("copied"); }, 2000);
    }
  });
}

function escHtml(str) {
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// ─── Init ────────────────────────────────────────────────────────
window.goPhase    = goPhase;
window.setStep    = setStep;
window.clearStep  = clearStep;
window.toggleExpand = toggleExpand;
window.copyText     = copyText;

(async () => {
  try {
    checked = await loadFromBin();
  } catch(e) {
    checked = {};
  }
  document.getElementById("loading").style.display = "none";
  const app = document.getElementById("app");
  app.style.display = "flex";
  updateProgress();
  renderSidebar();
  renderPhase();
})();
</script>
